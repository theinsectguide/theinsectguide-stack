<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="red-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Navy Midnight Canvas -->
  <rect width="512" height="512" rx="96" fill="#0c1022" />

  <!-- Insect Silhouette Group -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Antennae -->
    <path d="M 200 135 C 185 85 125 60 105 52" fill="none" stroke-width="12" />
    <path d="M 235 135 C 250 85 310 60 330 52" fill="none" stroke-width="12" />

    <!-- Front Legs (Top Left & Top Right) -->
    <path d="M 175 185 L 120 120 L 98 140" fill="none" stroke-width="14" />
    <path d="M 260 185 L 315 120 L 337 140" fill="none" stroke-width="14" />

    <!-- Middle Legs (Left & Right) -->
    <path d="M 160 260 L 105 270 L 68 285" fill="none" stroke-width="14" />
    <path d="M 275 260 L 330 270 L 367 285" fill="none" stroke-width="14" />

    <!-- Hind Legs (Bottom Left & Bottom Right) -->
    <path d="M 165 340 L 105 385 L 82 430" fill="none" stroke-width="14" />
    <path d="M 270 340 L 330 385 L 352 430" fill="none" stroke-width="14" />

    <!-- Head -->
    <path d="M 195 160 C 195 138 240 138 240 160 Z" stroke="none" />
    <ellipse cx="217" cy="152" rx="25" ry="18" stroke="none" />

    <!-- Pronotum / Thorax -->
    <path d="M 172 170 C 170 205 265 205 263 170 C 248 165 187 165 172 170 Z" stroke="none" />
    <path d="M 172 172 C 160 195 165 220 217 220 C 270 220 275 195 263 172 Z" stroke="none" />

    <!-- Elytra / Abdomen Body -->
    <path d="M 164 220 C 145 270 148 350 217 415 C 287 350 290 270 271 220 Z" stroke="none" />
    
    <!-- Central Elytra Seam Line (Dark navy line dividing the wings) -->
    <line x1="217.5" y1="225" x2="217.5" y2="408" stroke="#0c1022" stroke-width="4.5" />
  </g>

  <!-- Magnifying Glass & Scanner Target in Lower Right -->
  <g transform="translate(325, 335)">
    <!-- Handle extending down-right -->
    <line x1="68" y1="68" x2="135" y2="135" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

    <!-- Outer Lens Circle -->
    <circle cx="0" cy="0" r="102" fill="#0c1022" stroke="#ffffff" stroke-width="16" />

    <!-- Red Scanner HUD Reticle -->
    <g stroke="#ff2d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#red-glow)">
      <!-- Top-Left Corner Bracket -->
      <path d="M -52 -36 L -52 -52 L -36 -52" />
      
      <!-- Top-Right Corner Bracket -->
      <path d="M 36 -52 L 52 -52 L 52 -36" />
      
      <!-- Bottom-Left Corner Bracket -->
      <path d="M -52 36 L -52 52 L -36 52" />
      
      <!-- Bottom-Right Corner Bracket -->
      <path d="M 36 52 L 52 52 L 52 36" />

      <!-- Horizontal Red Laser Scan Line -->
      <line x1="-72" y1="0" x2="72" y2="0" stroke-width="5" />

      <!-- Central Audio / Waveform / Pulse Sensor Bars -->
      <line x1="-32" y1="-14" x2="-32" y2="14" stroke-width="6" />
      <line x1="-16" y1="-26" x2="-16" y2="26" stroke-width="6" />
      <line x1="0" y1="-38" x2="0" y2="38" stroke-width="6.5" />
      <line x1="16" y1="-26" x2="16" y2="26" stroke-width="6" />
      <line x1="32" y1="-14" x2="32" y2="14" stroke-width="6" />
    </g>
  </g>
</svg>
